[project]
name = "cross-session-snn"
version = "0.1.0"
description = "Cross-session neural decoding and stable channel masking experiments"
requires-python = ">=3.11,<3.12"
dependencies = [
    "h5py>=3.12,<4",
    "matplotlib>=3.9,<4",
    "numpy>=2,<3",
    "pandas>=2.2,<4",
    "pyyaml>=6,<7",
    "scipy>=1.15,<2",
    "snntorch==1.0.0",
    "torch==2.5.1",
    "tqdm>=4.67,<5",
]

[dependency-groups]
dev = [
    "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"
